[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG system with Docling, Milvus, MinIO and NVIDIA GPT-OSS-120B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-docling>=0.3.0",
    "langchain-milvus>=0.2.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "docling>=2.0.0",
    "sentence-transformers>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "streamlit>=1.28.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
